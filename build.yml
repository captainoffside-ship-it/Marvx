name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project and build
        run: |
          flutter create --org com.marsx --project-name marsx build_app
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib && cp -r lib build_app/lib
          sed -i 's/android:label="[^"]*"/android:label="Marsx"/' build_app/android/app/src/main/AndroidManifest.xml
          cd build_app
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: marsx-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
